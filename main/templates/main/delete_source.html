{% extends "main/base.html" %}
{% load static %}
{% block content %}
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'sources' %}">Sources</a></li>
                <li class="breadcrumb-item"><a href="{% url 'edit_source' source.pk %}">Source</a></li>
                <li class="breadcrumb-item active" aria-current="page">Delete</li>
            </ol>
        </nav>
        <h1>Delete source</h1>
        <h2 class="d-flex align-items-center gap-3">
            {% if source.icon %}
                <img src="{{ source.icon.url }}" alt="" class="app-icon">
            {% endif %}
            {{ source.name }}
        </h2>
        <h3 class="mt-3">Are you sure?</h3>
        <form action="" method="post">
            {% csrf_token %}
            <a href="{% url 'edit_source' source.pk %}" class="btn btn-primary">Cancel</a>
            <button type="submit" name="action" value="delete" class="btn btn-danger">Delete</button>
        </form>
    </div>
{% endblock %}
