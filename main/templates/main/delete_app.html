{% extends "main/base.html" %}
{% load static %}
{% block content %}
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'apps' %}">Apps</a></li>
                <li class="breadcrumb-item"><a href="{% url 'edit_app' app.pk %}">App</a></li>
                <li class="breadcrumb-item active" aria-current="page">Delete</li>
            </ol>
        </nav>
        <h1>Delete app</h1>
        <h2 class="d-flex align-items-center gap-3">
            {% if app.icon %}
                <img src="{{ app.icon.url }}" alt="" class="app-icon">
            {% endif %}
            {% if app.name %}{{ app.name }}{% else %}Unnamed App{% endif %}
        </h2>
        <h3 class="mt-3">Are you sure?</h3>
        <form action="" method="post">
            {% csrf_token %}
            <a href="{% url 'edit_app' app.pk %}" class="btn btn-primary">Cancel</a>
            <button type="submit" name="action" value="delete" class="btn btn-danger">Delete</button>
        </form>
    </div>
{% endblock %}
